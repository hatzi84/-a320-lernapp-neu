name: APK bauen

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android-Gerüst erzeugen und anpassen
        shell: bash
        run: |
          flutter create --platforms=android --org de.hatzi --project-name bzf_lernapp --empty "$RUNNER_TEMP/gen" 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp -r "$RUNNER_TEMP/gen/android" ./android
          python3 android_patch/patch.py 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Festen Signaturschlüssel einsetzen
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          cp keystore/debug.keystore "$HOME/.android/debug.keystore"

      - name: APK bauen
        shell: bash
        run: |
          flutter pub get 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          BN=$((100 + ${{ github.run_number }}))
          flutter build apk --release --no-shrink --build-number=$BN --dart-define=BUILD_NUMBER=$BN 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Signatur prüfen (muss zum festen Schlüssel passen)
        shell: bash
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECT=$(keytool -list -v -keystore keystore/debug.keystore -storepass android 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          GOT=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'SHA-256 digest' | sed 's/.*: *//' | tr -d ' ' | tr 'A-F' 'a-f')
          echo "erwartet: $EXPECT"; echo "gebaut:   $GOT"
          test -n "$EXPECT" && test "$EXPECT" = "$GOT"

      - name: Version veröffentlichen (nur main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk bzf-lernapp.apk
          BN=$((100 + ${{ github.run_number }}))
          gh release create "build-$BN" bzf-lernapp.apk --title "Build $BN" --notes "Automatischer Build"

      - name: Test-APK ablegen (andere Zweige)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: a320-lernapp-test
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Fehlerprotokoll sichern
        if: failure()
        shell: bash
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/build-log.txt" || echo "kein Log vorhanden" > "$RUNNER_TEMP/build-log.txt"
          git checkout --orphan buildlog
          git rm -rf . > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP/build-log.txt" build-log.txt
          git add build-log.txt
          git commit -m "Build-Log (Lauf ${{ github.run_number }})"
          git push -f origin buildlog
